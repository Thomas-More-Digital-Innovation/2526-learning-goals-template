name: Security Audit

on:
    schedule:
        - cron: "0 7 * * *"
    workflow_dispatch:
    push:
        branches: ["*"]
        paths:
            - "pnpm-lock.yaml"
            - ".github/workflows/audit.yml"
    pull_request:
        branches: ["*"]
        paths:
            - "pnpm-lock.yaml"
            - ".github/workflows/audit.yml"

permissions:
    contents: read
    issues: write

jobs:
    audit:
        name: Dependency Audit
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20.x

            - name: Run security audit
              run: pnpm audit --audit-level high

    notify:
        name: Notify on Failure
        runs-on: ubuntu-latest
        needs: [audit]
        if: failure() && github.event_name == 'schedule'
        steps:
            - name: Create GitHub Issue on Failure
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh issue create \
                    --repo ${{ github.repository }} \
                    --title "Security Audit Failure: Vulnerability Detected" \
                    --body "The scheduled security audit workflow failed. A dependency vulnerability may have been discovered in the frontend.

                    **Please review the run details:**
                    - **Workflow Run Logs:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                    - **Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')
                    
                    Please investigate and update the vulnerable dependencies immediately." \
                    --label "security,bug"
